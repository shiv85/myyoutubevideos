name: Daily ancient-India video

on:
  schedule:
    - cron: "23 0 * * *"        # every day 00:23 UTC = 5:53 AM India time
  workflow_dispatch:            # "Run workflow" button for a manual run
    inputs:
      topic:
        description: "Optional: force a topic (leave empty = next from topics.txt)"
        required: false
      upload:
        description: "Upload to YouTube?"
        type: boolean
        default: true

permissions:
  contents: write               # lets the bot save which topics it has already used

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Hindi text shaping
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 libharfbuzz0b fontconfig

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make (and upload) today's videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BOT_TOPIC: ${{ github.event.inputs.topic }}
          BOT_UPLOAD: ${{ github.event.inputs.upload }}
        run: python -m bot.main

      - name: Remember used topic
        if: success()
        run: |
          git config user.name "history-bot"
          git config user.email "history-bot@users.noreply.github.com"
          git add state/history.json
          git commit -m "Used topic $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Keep video files for 2 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          retention-days: 2
          if-no-files-found: ignore
          path: |
            output/long.mp4
            output/short.mp4
            output/thumbnail.jpg
            output/description.txt
            output/short_description.txt
            output/script.json
            output/result.json
